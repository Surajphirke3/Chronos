name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://127.0.0.1:27017/chronos_ci
      CHRONOS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALLOW_PUBLIC_REGISTRATION: 'false'
      TRUST_PROXY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Production build
        run: npm run build
